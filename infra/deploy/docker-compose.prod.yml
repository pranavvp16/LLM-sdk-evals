# Production overlay for a single-VM public deployment (CPU-only, no vLLM).
#
# Use it on top of the root compose file:
#     docker compose -f docker-compose.yml \
#                    -f infra/deploy/docker-compose.prod.yml up -d --build
#
# When deploying via CI, also layer infra/deploy/docker-compose.ci.yml on top
# so api/chatbot pull pre-built images from ACR instead of building locally.
#
# Adds:
#   • caddy          — TLS termination, reverse proxy to api/chatbot/grafana
# Overrides:
#   • api            — drops --reload (dev-only), CORS pinned to public host
#   • chatbot        — bakes NEXT_PUBLIC_API_URL=https://${PUBLIC_HOSTNAME}/api at build time
#   • postgres / clickhouse / redis / prometheus — port maps rebound to 127.0.0.1
#                                                  (defense in depth; NSG also blocks them)
#   • grafana        — served under /grafana/ sub-path

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      # Bearer the Caddyfile checks on /v1/*; cloud-init generates this.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
    volumes:
      - ./infra/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # Self-hosted OSS endpoint. Hosts two models:
  #   * qwen2.5:1.5b — chat / tool-calling model (Q4_K_M, ~1 GB)
  #   * llama-guard3:1b — safety classifier used as an input + output filter
  #     when a chat request sets guardrails="llamaguard" (also driven by the
  #     3-column eval ablation). Both are Q4 builds; combined ~1.6 GB.
  # Caddy reaches the endpoint over the docker network; the public /v1/*
  # path is bearer-gated.
  ollama:
    image: ollama/ollama:0.4.7
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"
      # Both models stay resident so the input + output filter calls and the
      # main chat call don't churn the model cache mid-request.
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama_models:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${OLLAMA_MODEL:-qwen2.5:1.5b}"
        ollama pull "$${OLLAMA_GUARD_MODEL:-llama-guard3:1b}"
        wait $$pid
    healthcheck:
      # Both models must be visible to ollama list before downstream services
      # (api / caddy) start accepting traffic.
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q qwen2.5 && ollama list 2>/dev/null | grep -q llama-guard3"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  api:
    command: >
      sh -c "python scripts/run_migrations.py &&
             uvicorn services.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      CORS_ORIGINS: '["https://${PUBLIC_HOSTNAME}"]'
      # Persist eval artifacts to a mounted volume so they survive
      # container recreation (e.g. each CI deploy).
      EVAL_RESULTS_PATH: /app/var/eval/results.json
      EVAL_REPORT_PATH: /app/var/eval/eval_report.pdf
      EVAL_COST_MD_PATH: /app/var/eval/eval_cost_latency.md
    volumes:
      - eval_artifacts:/app/var/eval
    depends_on:
      ollama:
        condition: service_healthy

  chatbot:
    build:
      context: services/chatbot
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://${PUBLIC_HOSTNAME}/api"
    environment:
      NEXT_PUBLIC_API_URL: "https://${PUBLIC_HOSTNAME}/api"

  # Internal-only services: no host port mapping. Reachable on the docker
  # network by service name (postgres, clickhouse, redis, prometheus,
  # grafana). Prometheus + Grafana are still reachable from the public
  # internet via Caddy at /grafana/ and (internally) at /prometheus would
  # be added if ever wanted. NSG already blocks the raw ports, but
  # dropping the host bind also avoids the docker port-allocator race
  # we hit after daemon restarts.
  postgres:
    ports: !reset []

  clickhouse:
    ports: !reset []

  redis:
    ports: !reset []

  prometheus:
    ports: !reset []

  grafana:
    environment:
      GF_SERVER_ROOT_URL: "https://${PUBLIC_HOSTNAME}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
  eval_artifacts:
  ollama_models:
